# Check that every policy file of the repository validates against the schema and
# keeps to the plain YAML the README allows. See tools/validate.py.
name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema==4.26.0" "PyYAML==6.0.4"
      - run: python tools/validate.py
