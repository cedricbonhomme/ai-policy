# ai-policy.yaml: a project's machine-readable stance on generative-AI
# contributions. Place at the repository root (or .well-known/ai-policy.yaml);
# point AGENTS.md / CONTRIBUTING.md at it, and (if you publish publiccode.yml)
# reference it there via externalMetadata: [{type: ai-policy, url: ...}].
#
# Guiding principle: this is a SIGNAL that boundaries exist and their broad
# shape, not an exhaustive rule engine. The authoritative detail lives in the
# human-readable policy `statement` points at; `exceptions: true` flags where
# the structured stance is a simplification. Every field is optional, but a
# file must declare something: a stance, by default or for one scope, any other
# rule, or an open question in `undecided`; a project with no AI-specific rule
# at all declares `summary: neutral` and nothing else.

version: 1

# Quick contribution-stance filter, for catalogs / badges. Optional and derived:
# if present it must match the stance below (default `assisted` is
# `restrictive`). neutral | permissive | mixed | restrictive | disallowed
summary: restrictive

# The human-readable policy contributors actually read, and the actionable
# guard-rail checklist (repo-relative paths or absolute URLs).
statement: AI_POLICY.md
guardrailsRef: CONTRIBUTING.md#ai-checklist

# Maturity of the policy itself. adopted | draft | under-discussion
status: adopted

# Questions not yet settled, as distinct from fields the file does not address.
# A listed field that also carries a value states the rule in force meanwhile;
# one without a value has no interim rule, and a consumer never reads it as
# permission. This example has settled everything, so it is empty; a project
# still debating would write, for example:
#   undecided: [defaults.stance, models]
# and, to accept AI contributions while it decides, keep `stance: generated`.
undecided: []

# `true` = the structured stance below is a summary; material carve-outs live
# in `statement`. Read the prose rather than treating the structure as complete.
exceptions: true

# Why the project holds this stance: a motivation signal for aggregation (the
# prose rationale stays in `statement`).
# code-quality | security | ip-provenance | licensing-ethics | data-consent |
#   labor-ethics | skill-preservation | environmental | oss-sustainability
concerns:
  values: [licensing-ethics, environmental, oss-sustainability]
  notes: >-
    Models trained on code without regard to its licence, the energy cost of
    training and running them, and the review time AI-driven volume takes
    from maintainers. Say it in your own words, above all a concern the list
    lacks.

# Defaults apply to any content-type scope not overridden in assertions[].
defaults:
  stance: assisted              # disallowed | assisted | generated
  # prohibited | none | encouraged | required
  # (`prohibited`: leave notes about AI tools out of the submission)
  disclosure: required
  # The contributor's own involvement: they have read, understood and tested
  # the change. The project's review is `review` below.
  humanReview: required         # none | required
  # The person who submits answers for all of it, AI-produced parts included.
  accountability: contributor   # contributor
  # Machine-checkable gates a contribution must clear.
  # tests-pass | new-tests-required | ci-green | type-check |
  #   no-generated-in-security-paths | provenance-attested |
  #   prompt-logs-retained | no-sensitive-data-to-3p | reproduced
  requirements: [tests-pass, new-tests-required, no-sensitive-data-to-3p]

# Per-scope overrides. A scope present here overrides `defaults` for that scope
# only; omitted fields inherit; omitted scopes fall back to `defaults`.
# scope vocabulary: code | docs | tests | comments | issue-descriptions |
#   pull-request-descriptions | commit-messages | translations | media |
#   security-reports
assertions:
  - scope: docs
    stance: generated
  - scope: comments             # human-authored communication
    stance: disallowed
    notes: Write in your own words; don't paste raw model output.
  - scope: media
    stance: disallowed
  - scope: security-reports
    humanReview: required
    requirements: [no-generated-in-security-paths, tests-pass, reproduced]
    notes: The reporter must have reproduced the problem themselves.

# Explicitly permitted AI uses whose output is NOT submitted as a contribution,
# so a restrictive stance doesn't read as blanket hostility. Assistance whose
# output IS contributed (code completion, mechanical refactoring) belongs in
# `stance: assisted`, not here.
# research | comprehension | bug-triage | debugging | accessibility |
#   spelling-grammar | translation
allowedUses: [research, debugging, accessibility]

# AI in the project's REVIEW of contributions: done *to* a contribution rather
# than being one, which is why it is not a `scope` value or an allowed use.
# The two enums are what a consumer branches on; everything else is a sentence.
review:
  aiAssist: permitted            # disallowed | permitted
  humanDecision: required        # none | required -- AI review never suffices alone
  notes: >-
    Review bots run under separate, blockable accounts and leave non-blocking
    comments; contributors must not request an AI-agent review.

# Rules for contributors with no merged contribution yet. `issuesHumanOnly`
# reserves newcomer / "good first issue" tickets for human authorship, to
# preserve the learning opportunity; the project's issue labels stay the
# human-facing marker, and this is the machine-readable signal.
newContributors:
  stance: assisted              # disallowed | assisted: stricter of this and the scope's wins
  issuesHumanOnly: true
  notes: Until your first contribution is merged, keep AI to menial help.

# Autonomous agents are a separate axis from `stance`.
autonomousAgents:
  allowed: false
  # How agent contributions must identify themselves (relevant wherever agents
  # may act, including via actorExceptions below).
  attestation:
    # bot-account | signed-commits | integration-manifest
    identity: [bot-account, signed-commits]
    account: "app/example-ai-bot"
  notes: >-
    Nuance that does not fit an enum goes in `notes`, on whichever object it
    qualifies. Here: an agent may run read-only analysis and post findings to an
    issue, but may not open a pull request.

# Some contributions need agreement BEFORE they are submitted, rather than
# merely meeting the rules at review time. This is the answer an agent needs on
# pre-flight: not "may I", but "may I without asking first".
priorArrangement:
  # agent-submissions | bulk-changes | ai-generated-prs
  appliesTo: [bulk-changes, ai-generated-prs]
  # accepted-issue | reviewer-agreement | governance-body | discussion
  basis: accepted-issue

# Actors governed differently: a declared signal, not a resolution layer;
# detail lives in notes/statement. The concrete, machine-actionable carve-out
# is agent autonomy.
actorExceptions:
  - actor: maintainers
    autonomousAgentsAllowed: true
    notes: Maintainers may use AI/agents at their own discretion; see statement.

# How disclosure is formatted, when required.
disclosureFormat:
  method: [commit-trailer]      # free-text | commit-trailer | pr-template | quote-block
  # One trailer, or several keyed by degree of AI involvement.
  trailers:
    assisted: "Assisted-by:"
    generated: "Generated-by:"
  # What a disclosure must state. tool | model | extent | usage
  content: [tool, extent]
  notes: >-
    Roughly how much is enough; nobody needs line counts.

# How the policy is enforced (declared intent only).
enforcement:
  mechanism: [maintainer-review]   # maintainer-review | ci-check | denylist | none

# Human accountability sign-off the project requires; an LLM/agent may never
# provide it. none | dco | cla
signoff: dco

# The AI used to BUILD the project (contribution provenance), NOT AI the
# shipped product runs at runtime, which is an ordinary runtime dependency.
models:
  policy:
    # Minimum acceptable model openness, by OSAID / Model Openness Framework
    # component. Omit a component, or use `any`, for no floor.
    openness:
      weights: available          # available | any
      trainingCode: any           # available | any
      trainingData: disclosed     # permissive | disclosed | any  (IP-cleanliness)
    notes: >
      Any AI coding tool is permitted, but avoid models known to reproduce
      non-permissively-licensed code verbatim.
