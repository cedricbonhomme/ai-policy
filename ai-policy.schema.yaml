# JSON Schema (draft 2020-12) for ai-policy.yml, authored in YAML for
# readability. Validates the machine-readable AI-contribution policy format;
# convert to JSON for tooling that requires it. Field semantics: see README.md
# and the commented ai-policy.example.yml.
#
# The stance field-set (`stance`/`disclosure`/`humanReview`/`requirements`) is
# defined once, in $defs.stanceOverride, and shared by `defaults` and each
# `assertions[]` entry, the "same fields" structural guarantee. `assertions[]`
# extends it with `scope` and uses `unevaluatedProperties: false` so the shared
# fields plus the local extension all validate strictly. `notes` lives in the
# shared set, so `defaults` and every `assertions[]` entry both carry it.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.org/ai-policy.schema.json"   # placeholder until a home is chosen
title: ai-policy
description: A project's machine-readable stance on generative-AI contributions.
type: object
unevaluatedProperties: false
# A file must declare something: `summary: neutral`, or at least one rule or
# open question. A stance may sit in `defaults` or in a single scope, since
# real policies govern, say, AI-written issues without a word about code.
# `summary` is optional because it is derived: when present it must match the
# stance field-set (see summary below), which needs a default stance, and a
# neutral file carries no AI-specific field.
allOf:
  - anyOf:
      - { required: [summary], properties: { summary: { const: neutral } } }
      - { required: [defaults], properties: { defaults: { minProperties: 1 } } }
      - { required: [assertions], properties: { assertions: { minItems: 1 } } }
      - { required: [undecided], properties: { undecided: { minItems: 1 } } }
      - required: [allowedUses]
      - required: [review]
      - required: [newContributors]
      - required: [autonomousAgents]
      - required: [priorArrangement]
      - required: [actorExceptions]
      - required: [disclosureFormat]
      - required: [enforcement]
      - required: [models]
  - if: { required: [summary], properties: { summary: { const: neutral } } }
    then:
      not:
        anyOf:
          - required: [defaults]
          - required: [assertions]
          - required: [allowedUses]
          - required: [review]
          - required: [newContributors]
          - required: [autonomousAgents]
          - required: [priorArrangement]
          - required: [actorExceptions]
          - required: [disclosureFormat]
          - required: [enforcement]
          - required: [models]
          - required: [undecided]
  - if: { required: [summary], properties: { summary: { const: disallowed } } }
    then: { $ref: "#/$defs/defaultStance/disallowed" }
  - if: { required: [summary], properties: { summary: { const: restrictive } } }
    then: { $ref: "#/$defs/defaultStance/assisted" }
  - if: { required: [summary], properties: { summary: { const: permissive } } }
    then:
      allOf: [{ $ref: "#/$defs/defaultStance/generated" }]
      not: { $ref: "#/$defs/aiSpecificCondition" }
  - if: { required: [summary], properties: { summary: { const: mixed } } }
    then:
      allOf: [{ $ref: "#/$defs/defaultStance/generated" }, { $ref: "#/$defs/aiSpecificCondition" }]

properties:
  version:
    description: The ai-policy format version.
    type: integer
    minimum: 1
  summary:
    description: >-
      Quick contribution-stance filter, derived from the rest of the file.
      `neutral`: no AI-specific rule; the project's ordinary contribution rules
      govern every contribution however it was made, and the file carries no
      other AI-specific field. `disallowed`: default stance `disallowed`.
      `restrictive`: default stance `assisted`. `permissive`: default stance
      `generated` with no AI-specific condition. `mixed`: default stance
      `generated` with at least one AI-specific condition: a scope held below
      `generated`, disclosure `required` or `prohibited`, a `requirements`
      gate, a non-empty `priorArrangement.appliesTo`, or a `newContributors`
      rule. Agent autonomy is a separate axis and
      does not affect it.
    enum: [neutral, permissive, mixed, restrictive, disallowed]
  statement:
    description: Pointer to the human-readable policy (repo-relative path or URL).
    type: string
  guardrailsRef:
    description: Pointer to the actionable guard-rail checklist (path or URL).
    type: string
  status:
    enum: [adopted, draft, under-discussion]
  undecided:
    description: >-
      Questions the project has considered and not yet settled, as distinct
      from fields it has not addressed at all. A listed field that carries a
      value states the rule in force meanwhile, permissive or restrictive, and
      a consumer applies it. A listed field with no value has no interim rule:
      a consumer never reads it as permission, and where it grants or withholds
      something the restrictive reading applies until the project decides.
    type: array
    uniqueItems: true
    items:
      enum: [defaults.stance, defaults.disclosure, defaults.humanReview,
             defaults.accountability,
             defaults.requirements, allowedUses, review,
             newContributors, autonomousAgents, actorExceptions,
             priorArrangement, disclosureFormat, enforcement, signoff, models,
             concerns]
  exceptions:
    description: The structured stance is a summary; carve-outs live in `statement`.
    type: boolean
  concerns:
    description: >-
      Why the project holds this stance: a motivation signal for aggregation,
      which changes nothing a consumer does. `values` names concerns from the
      shared vocabulary; `notes` states them in the project's own words,
      including any the vocabulary lacks, which is how a new value is chosen.
    type: object
    unevaluatedProperties: false
    properties:
      values:
        type: array
        uniqueItems: true
        items:
          enum: [code-quality, security, ip-provenance, licensing-ethics,
                 data-consent, labor-ethics, skill-preservation, environmental,
                 oss-sustainability]
        # code-quality: generated contributions lower quality or raise the
        #   review cost of each change.
        # security: generated content introduces vulnerabilities or exposes
        #   sensitive material.
        # ip-provenance: the origin, and so the licensability, of generated
        #   content cannot be established.
        # licensing-ethics: models are trained on works without regard to
        #   their licences.
        # data-consent: training or contributor data is used without consent.
        # labor-ethics: the labour conditions behind training, such as data
        #   labelling and content moderation.
        # skill-preservation: contributors, newcomers above all, stop learning
        #   the skills the project depends on.
        # environmental: the energy and water cost of training and running
        #   models.
        # oss-sustainability: maintainer load and the viability of volunteer
        #   maintenance, such as review burden from AI-driven volume.
      notes: { type: string }

  defaults:
    description: Base stance for any scope not overridden in assertions[].
    allOf: [{ $ref: "#/$defs/stanceOverride" }]
    unevaluatedProperties: false

  assertions:
    description: Per-scope overrides of `defaults`.
    type: array
    items:
      allOf: [{ $ref: "#/$defs/stanceOverride" }]
      required: [scope]
      properties:
        scope: { $ref: "#/$defs/scope" }
      unevaluatedProperties: false

  allowedUses:
    description: >-
      AI uses explicitly permitted because their output is NOT submitted as a
      contribution. Assistance whose output IS contributed (code completion,
      mechanical refactoring) is not listed here: that is `stance: assisted`.
      A use left out falls under the stance; an empty list says explicitly
      that no use is exempt.
    type: array
    uniqueItems: true
    items:
      enum: [research, comprehension, bug-triage, debugging, accessibility,
             spelling-grammar, translation]
      # research: finding and reading background material. comprehension:
      # explaining existing code or documentation. bug-triage: sorting and
      # deduplicating reports. debugging: locating the cause of a fault.
      # accessibility: assistive use by a contributor who needs it.
      # spelling-grammar: correcting the contributor's own text.
      # translation: translating the contributor's own text.

  review:
    description: >-
      AI in the project's REVIEW of contributions, which is done to a
      contribution rather than being one. Superseded `allowedUses:
      code-review-assist`, which could say only whether AI review was permitted
      and not whether it could decide.
    type: object
    unevaluatedProperties: false
    properties:
      aiAssist:
        description: Whether AI may assist a reviewer at all.
        enum: [disallowed, permitted]
      humanDecision:
        description: >-
          `required` means an AI review is never sufficient on its own; a human
          makes the merge decision.
        enum: [none, required]
      notes: { type: string }

  newContributors:
    description: >-
      Rules for contributors with no merged contribution to the project yet;
      a different threshold goes in `notes`. `stance` is the AI stance that
      applies to them, and for a new contributor the stricter of it and the
      scope's own stance wins. `issuesHumanOnly` reserves newcomer ("good
      first issue") tickets for human authorship.
    type: object
    unevaluatedProperties: false
    properties:
      stance: { enum: [disallowed, assisted] }
      issuesHumanOnly: { type: boolean }
      notes: { type: string }

  autonomousAgents:
    type: object
    unevaluatedProperties: false
    properties:
      allowed: { type: boolean }
      attestation:
        type: object
        unevaluatedProperties: false
        properties:
          identity:
            type: array
            uniqueItems: true
            items:
              enum: [bot-account, signed-commits, integration-manifest]
          account: { type: string }
          notes: { type: string }
      notes: { type: string }

  priorArrangement:
    description: >-
      Contributions of the listed kinds need agreement BEFORE submission, not
      only compliance at review. Covers the human contribution path as well as
      agents, since most projects that gate this way gate contributors rather
      than bots.
    type: object
    unevaluatedProperties: false
    properties:
      appliesTo:
        description: What triggers the gate; an empty list declares that nothing needs agreement in advance.
        type: array
        uniqueItems: true
        items:
          enum: [agent-submissions, bulk-changes, ai-generated-prs]
      basis:
        description: What satisfies the gate before submission.
        enum: [accepted-issue, reviewer-agreement, governance-body, discussion]
      notes: { type: string }

  actorExceptions:
    description: Actors governed differently (a declared signal, not a resolution layer).
    type: array
    items:
      type: object
      unevaluatedProperties: false
      required: [actor]
      properties:
        actor: { type: string }
        autonomousAgentsAllowed: { type: boolean }
        notes: { type: string }

  disclosureFormat:
    type: object
    unevaluatedProperties: false
    properties:
      method:
        description: Where a disclosure goes; several places may be required.
        type: array
        uniqueItems: true
        items:
          enum: [free-text, commit-trailer, pr-template, quote-block]
      content:
        description: >-
          What a disclosure must state. `tool`: the AI tool or agent used.
          `model`: the model and its version. `extent`: how much of the work
          AI did. `usage`: what AI was used for.
        type: array
        uniqueItems: true
        items:
          enum: [tool, model, extent, usage]
      trailer:
        description: A single trailer string (alternative to `trailers`).
        type: string
      trailers:
        description: Trailers keyed by degree of AI involvement (e.g. assisted, generated).
        type: object
        additionalProperties: { type: string }
      notes: { type: string }

  enforcement:
    type: object
    unevaluatedProperties: false
    properties:
      mechanism:
        type: array
        uniqueItems: true
        items:
          enum: [maintainer-review, ci-check, denylist, none]
      consequence: { type: string }
      notes: { type: string }

  signoff:
    description: Human accountability sign-off; an LLM/agent may never provide it.
    enum: [none, dco, cla]

  models:
    description: The AI used in DEVELOPMENT (contribution provenance), not runtime deps.
    type: object
    unevaluatedProperties: false
    properties:
      policy:
        type: object
        unevaluatedProperties: false
        properties:
          openness:
            description: Minimum acceptable openness, by Model Openness Framework component.
            type: object
            unevaluatedProperties: false
            properties:
              weights: { enum: [available, any] }
              trainingCode: { enum: [available, any] }
              trainingData: { enum: [permissive, disclosed, any] }
          notes: { type: string }

$defs:
  # The stance field-set shared by `defaults` and each `assertions[]` entry.
  stanceOverride:
    type: object
    properties:
      stance:
        description: >-
          What a contribution may contain. `disallowed`: nothing produced by
          AI. `assisted`: AI may help only menially (completion,
          find-and-replace, mechanical refactoring); the substance is the
          contributor's. `generated`: AI may produce the substance, subject to
          the rest of the file.
        enum: [disallowed, assisted, generated]
      disclosure:
        description: >-
          Whether a contribution should note AI involvement. `none` means not
          asked for; `prohibited` means notes about AI tools must be left out,
          so a consumer that adds a disclosure trailer by default must not;
          `encouraged` means welcome but not gated on; `required` means a
          contribution without it may be refused. Where and how is
          `disclosureFormat`.
        enum: [prohibited, none, encouraged, required]
      humanReview:
        description: >-
          The CONTRIBUTOR's involvement: `required` means the submitter has
          personally reviewed, understood and tested the change. Whether they
          answer for it is `accountability`; the project's own review is
          `review.humanDecision`.
        enum: [none, required]
      accountability:
        description: >-
          `contributor`: the person who submits a contribution answers for all
          of it, including any AI-produced part. Absent means the policy does
          not say; no surveyed policy disclaims accountability.
        enum: [contributor]
      requirements:
        type: array
        uniqueItems: true
        items: { $ref: "#/$defs/requirement" }
      notes: { type: string }

  scope:
    description: >-
      The content type a rule applies to. `comments` covers replies in issues
      and reviews; `issue-descriptions` and `pull-request-descriptions` the
      opening text of each; `media` images, audio and video.
    enum: [code, docs, tests, comments, issue-descriptions,
           pull-request-descriptions, commit-messages, translations, media,
           security-reports]

  requirement:
    description: >-
      A gate the contributor can check before submitting. `tests-pass`: the
      existing tests pass with the change. `new-tests-required`: the change
      adds tests for what it changes. `ci-green`: the project's CI passes.
      `type-check`: type checking passes. `no-generated-in-security-paths`: no
      AI-produced content in code the project designates security-sensitive,
      named in `notes` or `statement`. `provenance-attested`: the contributor
      affirms the right to submit every part under the project's licence.
      `prompt-logs-retained`: the contributor keeps the prompts and outputs
      behind AI-produced parts and can produce them on request.
      `no-sensitive-data-to-3p`: no non-public project material (undisclosed
      vulnerabilities, credentials, private code) was given to a third-party AI
      service. `reproduced`: the contributor has personally reproduced the
      problem the report or fix addresses.
    enum: [tests-pass, new-tests-required, ci-green, type-check,
           no-generated-in-security-paths, provenance-attested,
           prompt-logs-retained, no-sensitive-data-to-3p, reproduced]

  # The default stance a derived `summary` requires.
  defaultStance:
    disallowed: { required: [defaults], properties: { defaults: { required: [stance], properties: { stance: { const: disallowed } } } } }
    assisted: { required: [defaults], properties: { defaults: { required: [stance], properties: { stance: { const: assisted } } } } }
    generated: { required: [defaults], properties: { defaults: { required: [stance], properties: { stance: { const: generated } } } } }

  # An AI-specific condition on an otherwise `generated` stance: what separates
  # a `mixed` summary from a `permissive` one.
  aiSpecificCondition:
    anyOf:
      - { required: [priorArrangement], properties: { priorArrangement: { required: [appliesTo], properties: { appliesTo: { minItems: 1 } } } } }
      - { required: [newContributors], properties: { newContributors: { anyOf: [{ required: [stance] }, { required: [issuesHumanOnly], properties: { issuesHumanOnly: { const: true } } }] } } }
      - { required: [defaults], properties: { defaults: { $ref: "#/$defs/conditionInSet" } } }
      - required: [assertions]
        properties:
          assertions:
            contains:
              anyOf:
                - { required: [stance], properties: { stance: { enum: [disallowed, assisted] } } }
                - $ref: "#/$defs/conditionInSet"
  conditionInSet:
    anyOf:
      - { required: [disclosure], properties: { disclosure: { enum: [required, prohibited] } } }
      - { required: [requirements], properties: { requirements: { minItems: 1 } } }
