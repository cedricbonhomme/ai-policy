# The "AI Disallowed" preset from ai-policy.dev, expressed in this format.
# Ship it as ai-policy.yml beside the preset's AI_POLICY.md.
version: 1

summary: disallowed
statement: AI_POLICY.md
status: adopted
exceptions: true          # suspected AI use is rejected unless disproved

defaults:
  stance: disallowed

# Not even translation, spelling, or finding bugs to fix in your own words.
allowedUses: []

autonomousAgents:
  allowed: false

enforcement:
  mechanism: [maintainer-review]

