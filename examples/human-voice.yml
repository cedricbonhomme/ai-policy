# The "Human Voice" preset from ai-policy.dev, expressed in this format.
# Ship it as ai-policy.yml beside the preset's AI_POLICY.md.
version: 1

summary: mixed
statement: AI_POLICY.md
status: adopted
exceptions: true          # "never let an LLM think for you" lives in the prose

defaults:
  stance: generated       # AI may generate code and help explore ideas
  humanReview: required   # submit only what you fully understand and can explain

# Communication must be in the contributor's own voice.
assertions:
  - scope: comments
    stance: disallowed
  - scope: issue-descriptions
    stance: disallowed
  - scope: pull-request-descriptions
    stance: disallowed
    notes: Do not quote a model in issues or pull requests.
